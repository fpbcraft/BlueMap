name: Build

on:
  push:
    branches: [v5.7-fpb]
  pull_request:
  workflow_dispatch:
    inputs:
      docker:
        description: Also build the standalone CLI Docker image
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: common/webapp/package-lock.json
      - name: Check frontend and version tooling
        run: |
          node --test common/webapp/tests/*.test.mjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Resolve development version
        run: echo "RELEASE_VERSION=$(python3 scripts/release_version.py dev --sha "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Build NeoForge 1.21.1 only
        run: >-
          ./gradlew -PbluemapPlatforms=neoforge --configure-on-demand
          :core:spotlessCheck :common:spotlessCheck :neoforge:spotlessCheck
          :core:test :common:test :neoforge:test :neoforge:release --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: bluemap-neoforge-1.21.1-${{ github.sha }}
          path: build/release/*-neoforge.jar
          if-no-files-found: error

  docker:
    if: github.event_name == 'workflow_dispatch' && inputs.docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build CLI for the Docker image
        run: ./gradlew -PbluemapPlatforms=cli --configure-on-demand :cli:release --no-daemon
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=dev-${{ github.sha }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
