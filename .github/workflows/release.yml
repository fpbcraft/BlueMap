name: Semantic Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump when exact version is empty
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      version:
        description: Optional exact SemVer (for example 5.7.1 or 5.7.1-rc.1)
        type: string
        default: ''
      include_cli:
        description: Also publish the standalone CLI jar for texture migration
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: common/webapp/package-lock.json
      - name: Check frontend and version tooling
        run: |
          node --test common/webapp/tests/*.test.mjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Resolve release version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXACT_VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/v5.7-fpb || {
              echo "::error::Release tags must point to a commit on v5.7-fpb."
              exit 1
            }
            version="$(python3 scripts/release_version.py from-tag "$GITHUB_REF_NAME")"
            create_tag=false
          else
            if [[ "$GITHUB_REF_NAME" != "v5.7-fpb" ]]; then
              echo "::error::Manual releases must run from v5.7-fpb."
              exit 1
            fi
            version="$(python3 scripts/release_version.py next --bump "$BUMP" --exact "$EXACT_VERSION")"
            create_tag=true
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
              echo "::error::Release tag v$version already exists; versions are immutable."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"
      - name: Build and test release
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          INCLUDE_CLI: ${{ inputs.include_cli }}
        run: |
          platforms=neoforge
          tasks=(:core:spotlessCheck :common:spotlessCheck :neoforge:spotlessCheck :core:test :common:test :neoforge:test :neoforge:release)
          if [[ "$INCLUDE_CLI" == "true" ]]; then
            platforms=neoforge,cli
            tasks+=(:cli:spotlessCheck :cli:release)
          fi
          ./gradlew "-PbluemapPlatforms=$platforms" --configure-on-demand "${tasks[@]}" --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: bluemap-${{ steps.release.outputs.version }}-neoforge-1.21.1
          path: build/release/*.jar
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          CREATE_TAG: ${{ steps.release.outputs.create_tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease+=(--prerelease); fi
          if [[ "$CREATE_TAG" == "true" ]]; then
            gh release create "v$VERSION" build/release/*.jar --target "$TARGET_SHA" --title "v$VERSION" --generate-notes "${prerelease[@]}"
          else
            gh release create "v$VERSION" build/release/*.jar --verify-tag --title "v$VERSION" --generate-notes "${prerelease[@]}"
          fi
